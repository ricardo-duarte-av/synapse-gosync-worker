# Synapse gosync-worker configuration.
#
# A Go reimplementation of Synapse's classic /sync worker. It reads Synapse's
# PostgreSQL directly and follows Synapse's replication stream over Redis.
#
# Nothing is routed to this worker. It exists to be driven deliberately by
# cmd/syncdiff and by a test account, and compared against a real Synapse sync
# worker, until its answers are trusted.

server_name: aguiarvieira.pt

listen:
  # NOT under /var/sockets/nginx. Everything in that directory is an nginx
  # upstream by convention, and this worker must never receive real client
  # traffic by accident.
  socket: /var/sockets/gosync-worker.sock
  # 0660 is enough: only the comparator and the operator connect here. Synapse's
  # own worker sockets are 0666 because nginx runs in another container as a
  # different uid, which does not apply to us.
  socket_mode: "0660"

# Read-only access to Synapse's PostgreSQL.
#
# The unix socket needs no password and no network path.
#
# This deployment reuses `gopro_ro`, the role synapse-gopro-worker already runs
# as: it has SELECT on every table, default_transaction_read_only, and a
# statement_timeout, which is exactly what is wanted here. A second role would
# have added a superuser step and a second thing to keep in step with schema
# migrations for no additional guarantee. deploy/readonly-role.sql remains for
# a deployment that has no such role yet.
#
# Read-only is not merely a convention here: every query in internal/store is a
# SELECT, and the role enforces it. The one exception is to-device deletion,
# which gets its own role and its own pool below.
database:
  dsn: "host=/var/sockets user=gopro_ro dbname=synapse-db"
  # Bounded well below Synapse's own pool so this worker cannot starve it.
  max_conns: 16
  connect_timeout_seconds: 10

# The to_device section of /sync, and the only write this worker makes.
#
# Synapse's /sync deletes the to-device messages a device has acknowledged,
# bounded by its `since`. Serving the section without deleting would hand a
# client the same room keys on every sync for ever, so there is no
# "serve but do not delete" setting: leave this disabled and the section is
# omitted entirely, which is correct as long as a real Synapse worker is also
# syncing that device.
#
# The dsn must name the narrow role from deploy/device-inbox-role.sql, granted
# SELECT and DELETE on device_inbox and nothing else. The worker verifies that
# at startup and refuses to run if the role is broader.
#
# WARNING: enabling this makes the worker destructive for every device that
# syncs against it. A device syncing against BOTH this worker and Synapse will
# have messages deleted by whichever one it acknowledges them to -- which is
# fine, deletion is bounded by the client's own `since` either way -- but a
# device driven by a comparator whose `since` runs ahead of a real client's
# would delete messages that client has not yet seen. Point it at test devices.
to_device:
  enabled: false
  dsn: "host=/var/sockets user=gosync_inbox dbname=synapse-db"
  max_conns: 4
  connect_timeout_seconds: 10

# Synapse's replication stream, over Redis (KeyDB here).
#
# Every long-poll wakeup comes from here. On a worker, Synapse's notifier is
# driven entirely by replication -- a worker never learns about a new event by
# persisting it -- so without this subscription /sync would answer correctly but
# only ever on timeout, never promptly.
#
# SUBSCRIBE only, deliberately. A real Synapse worker also PUBLISHes a
# `REPLICATE` command on connect to ask the other workers for their current
# stream positions; doing that here would make every one of them broadcast
# POSITION rows on our account. Positions are seeded from the database and
# corrected as traffic arrives instead.
#
# Without this, `timeout` is ignored (no long-polling), typing cannot be
# reported at all, and stream positions are only as fresh as the startup seed. This is the *stream* replication every Synapse worker consumes, not the
# HTTP `replication` listener and instance_map entry, which only writers need.
replication:
  enabled: true
  # Unix socket path, or host:port.
  address: /var/sockets/keydb
  # MUST equal Synapse's server_name: the channel is named after it, and one
  # Redis can carry several homeservers' streams. Subscribing to the wrong
  # channel raises no error and delivers nothing, so the worker would simply
  # never wake up and would look merely idle. Defaults to server_name above.
  channel: aguiarvieira.pt
  # password: ""
  # db: 0

# Access-token authentication, by asking Synapse.
#
# Deliberately NOT a SELECT against access_tokens, even though Synapse's own
# lookup is a plain `WHERE token = ?` with no hashing. Three kinds of caller
# would be wrongly rejected by that query: appservice tokens live in
# registration files and never reach the database; delegated auth (MAS) keeps
# tokens outside Synapse entirely; and guest tokens are macaroons, verifiable
# only with macaroon_secret_key -- which this worker must never hold. There are
# 79 guest accounts on this homeserver, so that last one is not hypothetical.
#
# whoami also returns the device_id, which /sync cannot work without: to-device
# messages and device-list updates are per-device, not per-user.
auth:
  whoami_socket: /var/sockets/nginx/av-request-worker-1.sock
  positive_ttl: 5m
  # A rejection is cached too, so a bad token cannot become a stream of requests
  # to Synapse. Short, because a token can be granted at any moment.
  negative_ttl: 30s
  max_entries: 20000
  timeout_seconds: 10

# The Synapse sync worker that cmd/syncdiff compares against.
#
# It MUST have `sync_response_cache_duration: 0`. Synapse caches a sync response
# keyed by (user, timeout, since, filter, full_state, device_id, ...) for two
# minutes by default -- five on av-sync-worker-1. A comparator that replays a
# request against a caching worker is handed a frozen earlier answer and told it
# matched, which is the most dangerous possible failure mode: it reports success.
#
# For the same reason this must not be av-sync-worker-1, which serves real
# clients and whose cache is deliberately longer (5m, set explicitly).
#
# av-sync-worker-2 is up with the cache disabled. Note that its socket lives
# under /var/sockets/nginx/ by Synapse's worker convention even though nginx
# routes nothing to it.
reference:
  socket: /var/sockets/nginx/av-sync-worker-2.sock

# Parts of Synapse's experimental_features that change what a response contains.
#
# Synapse's own field names, so these paste straight across from
# homeserver.yaml. They are configured here rather than read from that file,
# which is never mounted: it carries macaroon_secret_key,
# registration_shared_secret and the database password inline.
#
# Copy the ACTIVE settings. Getting msc4354_enabled wrong is invisible until an
# event is actually sticky, and then every response containing one differs.
experimental:
  msc4354_enabled: true
  msc3391_enabled: true
  # These gate individual base push rules. Each adds or removes a rule from
  # every user's ruleset, so a wrong value here is wrong for everybody.
  msc1767_enabled: true
  msc3381_polls_enabled: true
  msc3664_enabled: true
  msc4028_push_encrypted_events: true
  # Note the inverted sense: MSC4210 REMOVES the legacy mention rules.
  msc4210_enabled: true
  msc4306_enabled: true
  # MSC4222: lets a client ask for `state_after` instead of `state`. Opt-in per
  # request, so enabling it changes nothing until a client asks.
  msc4222_enabled: true
  # MSC3773 makes `org.matrix.msc3773.unread_thread_notifications` an alias for
  # the stable filter field. It changes only how a filter is READ -- we do not
  # yet emit per-thread counts either way; see README.md.
  msc3773_enabled: true
  # MSC3874 enables a filter's `rel_types` fields. They filter /messages rather
  # than /sync, so this is here only so a filter carrying them is read the same
  # way by both implementations.
  msc3874_enabled: false

# Caps `room.timeline.limit` in an INLINE filter -- and only an inline one.
#
# Synapse applies set_timeline_upper_limit on the branch that parses a filter
# from the query string and not on the branch that looks one up by ID, so a
# client can exceed this by uploading the filter first. It is therefore not a
# bound on anything; match the reference server's value rather than choosing a
# safe-looking one. Synapse's default is 100; -1 disables the cap.
filter_timeline_limit: 1000

caches:
  # Master switch for the DERIVED caches -- the ones holding data that can
  # change, kept fresh by invalidations arriving over replication.
  #
  # It exists to be turned off. Two builds of one commit, one with caches and
  # one without, compared with cmd/syncdiff, is the only way to test a cache:
  # both sides are this worker, so every legitimate reason two /sync answers
  # differ falls away and what is left is a cache bug. Also the first thing to
  # try when a response looks wrong.
  #
  # Defaults to true. It does not affect the state-group caches below, which
  # hold immutable data and are always on.
  enabled: true

  # Per-cache bounds, in ENTRIES -- not bytes, and that distinction matters
  # here more than it usually does, because what an entry costs differs by a
  # factor of thirty-five between these caches. Measured:
  #
  #     rooms_for_user      a  20-room user ~3.9KB
  #                         a 100-room user  ~21KB
  #                         a 654-room user ~139KB
  #     everything else     tens of bytes to ~1KB
  #
  # So these numbers are not comparable with one another. Raising
  # room_summary to 50000 costs a few tens of megabytes; raising
  # rooms_for_user to 5000 costs two thirds of a gigabyte on an account like
  # the one this was built against, in a worker that otherwise runs in 20MB.
  #
  # WHAT DRIVES EACH ONE. Devices are mostly not the answer -- a user with a
  # hundred logins still has one entry in the caches that hold real memory:
  #
  #     per DEVICE   access_token  (one token per login)
  #                  user_filter   (each client uploads its own)
  #     per USER     rooms_for_user, ignored_users
  #     per ROOM     room_summary, history_visibility, room_info,
  #                  and the state caches below
  #
  # A hundred devices on one account therefore adds ~200 small entries and no
  # meaningful memory. A hundred *users*, or a user in six hundred rooms, is
  # what moves the number. Size room-keyed caches to the rooms on the server;
  # size rooms_for_user to the number of local users who actually sync here,
  # and downwards if they are in many rooms.
  #
  # Zero takes the default shown; negative disables one cache without
  # disabling the rest, which is how to bisect a suspected cache without
  # rebuilding. Watch gosync_cache_evictions_total to tell a cache that is too
  # small from one that is simply not asked.
  #
  # A derived cache answers only when replication has caught up to the token
  # the response will report -- see internal/store/derived.go. That is why a
  # cold worker shows misses with no hits for the first moments after a
  # reconnect, and why gosync_cache_armed is worth a panel: while it is 0 the
  # caches are refusing to answer because invalidations are not arriving.
  #user_filter_cache_size: 5000
  #room_info_cache_size: 20000
  #access_token_cache_size: 20000
  #room_summary_cache_size: 20000
  #history_visibility_cache_size: 20000
  #ignored_users_cache_size: 5000
  #rooms_for_user_cache_size: 1000

  # Stream-change caches: "has this room or user changed since position P?"
  #
  # A different kind of cache from the ones above, and sized on a different
  # axis. Those hold an ANSWER and must be invalidated when it changes. These
  # hold no answer at all -- only whether asking is worth it -- and are kept
  # warm by replication rather than invalidated. They are what let a quiet sync
  # skip the presence query (25ms warm, 430ms cold, previously run once per
  # sync whether or not anybody's presence had moved) and the timeline-gap
  # lookup.
  #
  # The unit is distinct stream POSITIONS, not entries: one position can name
  # many rooms. So these do not scale with users or rooms the way the caches
  # above do, and the default of 10000 is Synapse's.
  #
  # The failure to watch for is not memory, it is a cache that has quietly
  # stopped working. Too small for a busy stream and its horizon climbs above
  # the `since` values clients actually send; every question then falls below
  # it, every gate answers "changed", and the queries come back with no error
  # and no wrong answer. gosync_stream_cache_earliest_position is that horizon
  # -- compare it against the stream's current position, and watch
  # gosync_stream_cache_evictions_total alongside it.
  #
  # Measured on this deployment, 2026-09-03, with the defaults: events covers
  # ~100,000 stream orderings and evicts nothing; presence covers ~8.9M
  # positions but evicts ~23,000 of 33,000 users during prefill, because the
  # presence stream is far busier than the rest. That is harmless here only
  # because the presence gate reads the cache's maximum position rather than
  # any individual user; raise it if a user-keyed presence question is ever
  # added.
  #
  # Two of these are armed empty rather than prefilled, deliberately:
  # account_data's position space is shared by three tables, so seeding from
  # any one of them produces a horizon far below what it can account for, and
  # membership has no table to seed from at all. Both fill from live traffic.
  # See internal/store/streamgates.go.
  #events_stream_cache_size: 10000
  #membership_stream_cache_size: 10000
  #receipts_stream_cache_size: 10000
  #account_data_stream_cache_size: 10000
  #to_device_stream_cache_size: 10000
  #presence_stream_cache_size: 10000

  # The immutable state caches. A state group's contents are fixed once
  # written, so these need no invalidation -- only the purge that happens when
  # replication drops and rooms could be deleted unseen.
  #state_group_cache_size: 50000
  #filtered_state_cache_size: 20000

  # How many member events one device's lazy-loading cache remembers, which
  # decides how often a lazy-loading client is re-sent members it already has.
  #
  # Synapse asks for 100 and then multiplies by `caches.global_factor`, whose
  # default is 0.5 -- so the effective size on a default deployment is 50, not
  # 100. Read the factor off the REFERENCE WORKER's config, not the
  # homeserver's: a worker may override it, and av-sync-worker-2 does.
  lazy_load_members_cache_size: 100
  # How long a device's cache lives, measured from creation rather than last
  # use. Synapse builds it without reset_expiry_on_get, so a continuously
  # syncing client still loses its lazy-loading state every 30 minutes and is
  # re-sent every member it already has.
  lazy_load_members_cache_ttl: 30m

testing:
  # Enables ?_gosync_now=<token>, which forces the now_token this worker
  # computes against instead of reading the current stream position.
  #
  # This is the hinge the entire verification story turns on. Ask two sync
  # implementations the same question a second apart and they will legitimately
  # disagree, because each snapshots the stream position at its own start:
  # anything persisted in between appears in one answer and not the other. There
  # is no amount of care in the comparator that fixes that from the outside.
  # Pinning both sides to one token is what makes a difference mean a bug.
  #
  # It also accepts a window that has not happened yet, so it MUST be false in
  # production.
  allow_pin_now: false

# A SECOND listener, for metrics alone.
#
# The client API above is a unix socket and Prometheus cannot scrape one, so
# without this there is nothing to scrape and every dashboard panel is empty --
# which is worse than no dashboard, because it looks like an idle worker.
#
# /metrics is unauthenticated. Keep this port on an internal network and never
# route it through the reverse proxy: only /_matrix paths should be public. The
# same listener also answers /health.
#
# Leave it empty to serve no metrics at all.
metrics:
  addr: ":9201"

log:
  level: info
  # Human-readable coloured console output instead of JSON. For eyes only;
  # leave it off if anything downstream parses the log.
  pretty: false
